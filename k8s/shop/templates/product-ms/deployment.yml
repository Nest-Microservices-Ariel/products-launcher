apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: product-ms
  name: product-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-ms
  strategy: {}
  template:
    metadata:
      labels:
        app: product-ms
    spec:
      containers:
      - image: europe-southwest1-docker.pkg.dev/product-launcher-498816/image-registry/product-ms
        name: product-ms
        env:
        - name: PORT
          value: "3000"
        - name: NATS_SERVERS
          value: "nats://nats"
        - name: DATABASE_URL
          value: "file:./prisma/dev.db"
        resources: {}
status: {}
