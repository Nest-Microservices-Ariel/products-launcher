services:
  nats-server:
    image: nats:latest

  client-gateway:
    build:
      context: ./client-gateway #path where can find the dockerfile.prod
      dockerfile: dockerfile.prod
    image: client-gateway-prod #this is the name of image when is released
    ports:
      - ${CLIENT_GATEWAY_PORT}:${CLIENT_GATEWAY_PORT}
    environment:
      - PORT=${CLIENT_GATEWAY_PORT}
      - NATS_SERVERS=nats://nats-server:4222

  auth-ms:
    build:
      context: ./auth-ms
      dockerfile: dockerfile.prod
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: auth-ms-prod
    environment:
      - PORT=3004
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET_AUTH_MS}

  product-ms:
    build:
      context: ./product-ms
      dockerfile: dockerfile.prod
    image: product-ms
    environment:
      - PORT=3001
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=file:./prisma/dev.db

  orders-ms:
    build:
      context: ./orders-ms
      dockerfile: dockerfile.prod
      args:
        ORDERS_DATABASE_URL: ${ORDERS_DATABASE_URL}
    image: orders-ms
    environment:
      - PORT=3002
      - DATABASE_URL=${ORDERS_DATABASE_URL}
      - NATS_SERVERS=nats://nats-server:4222

